name: Test library
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . pytest pytest-asyncio pytest-cov pytest-socket build twine
      - run: pytest -q --disable-socket --allow-unix-socket --cov=pyelternportal.client --cov=pyelternportal.counts --cov=pyelternportal.registrations --cov-report=term-missing
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/check_distribution.py
